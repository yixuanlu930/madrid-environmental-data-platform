services:
  minio:
    image: minio/minio:latest
    container_name: madrid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - madrid-data-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: madrid-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-madrid-openmeteo-environment}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set download local/$$MINIO_BUCKET || true;
      exit 0;
      "
    networks:
      - madrid-data-net

  etl:
    build: .
    container_name: madrid-etl
    env_file:
      - .env
    environment:
      MADRID_LATITUDE: ${MADRID_LATITUDE:-40.4168}
      MADRID_LONGITUDE: ${MADRID_LONGITUDE:--3.7038}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}

      HISTORICAL_WEATHER_URL: ${HISTORICAL_WEATHER_URL:-https://archive-api.open-meteo.com/v1/archive}
      AIR_QUALITY_URL: ${AIR_QUALITY_URL:-https://air-quality-api.open-meteo.com/v1/air-quality}

      WEATHER_HOURLY_VARIABLES: ${WEATHER_HOURLY_VARIABLES:-temperature_2m,precipitation}
      AIR_QUALITY_HOURLY_VARIABLES: ${AIR_QUALITY_HOURLY_VARIABLES:-ozone,carbon_dioxide}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-madrid-openmeteo-environment}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}

      ETL_PORT: ${ETL_PORT:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - madrid-data-net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: madrid-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      TZ: ${TIMEZONE:-Europe/Madrid}
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - etl
    networks:
      - madrid-data-net
    restart: unless-stopped

  n8n-init:
    image: n8nio/n8n:latest
    container_name: madrid-n8n-init
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      n8n import:workflow --input=/workflows/madrid_environment_daily.json &&
      echo 'Workflow imported successfully';
      exit 0;
      "
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      TZ: ${TIMEZONE:-Europe/Madrid}
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - n8n
    networks:
      - madrid-data-net

  jupyter:
    build: .
    container_name: madrid-jupyter
    command: >
      jupyter lab
      --ServerApp.ip=0.0.0.0
      --ServerApp.port=8888
      --ServerApp.allow_root=True
      --ServerApp.open_browser=False
      --ServerApp.root_dir=/app
      --ServerApp.default_url=/lab/tree/notebooks
      --ServerApp.token=''
      --ServerApp.password=''
      --IdentityProvider.token=''
      --ServerApp.disable_check_xsrf=True
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-madrid-openmeteo-environment}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    ports:
      - "8890:8888"
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    depends_on:
      minio:
        condition: service_healthy
      etl:
        condition: service_started
    networks:
      - madrid-data-net
    restart: unless-stopped

volumes:
  minio_data:
  n8n_data:

networks:
  madrid-data-net:
    driver: bridge
